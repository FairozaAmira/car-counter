name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install
        run: make install
      - name: Lint fix
        run: |
          make lint-fix
          git diff --exit-code
      - name: Format check
        run: make format-check
      - name: Type check
        run: make typecheck
      - name: Test with coverage
        run: make test-coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-image-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build staging image
        run: docker build --tag aips-car-counter:staging .

  publish-image-staging:
    needs: build-image-staging
    runs-on: ubuntu-latest
    steps:
      - name: Publish staging image
        run: echo "Placeholder — publish the staging image when a staging registry is available."

  build-image-production:
    needs: publish-image-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag aips-car-counter:production .

  publish-image-production:
    needs: build-image-production
    runs-on: ubuntu-latest
    steps:
      - name: Publish production image
        run: echo "Placeholder — publish the production image when a production registry is available."
