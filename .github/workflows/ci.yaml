name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://application:application@localhost:5432/application_test
      RUN_DATABASE_TESTS: "1"
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: application_test
          POSTGRES_USER: application
          POSTGRES_PASSWORD: application
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U application -d application_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12.13
      - name: Prepare disposable test database
        run: make db-upgrade
      - name: Quality checks
        run: make ci
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate production image
        run: make docker-build
