[project]
name = "aips-car-counter"
version = "1.0.0"
description = "Async FastAPI and Kafka solution for the AIPS traffic counter challenge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.12.0,<1",
    "fastapi>=0.115.0,<1",
    "pydantic-settings>=2.7.0,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "mypy>=1.14.0,<2",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.25.0,<2",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.9.0,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["src/tests"]
markers = [
    "broker: tests requiring a running Kafka broker",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["src/tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true
